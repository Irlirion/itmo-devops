x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    _AIRFLOW_WWW_USER_USERNAME: 'airflow'
    _AIRFLOW_WWW_USER_PASSWORD: 'airflow'
    SPARK_HOME: /home/airflow/.local/lib/python3.8/site-packages/pyspark
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./spark:/opt/airflow/spark
    - ./output:/opt/airflow/output
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  spark-master:
    container_name: spark-master
    image: apache/spark:3.5.0
    user: root
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "4040:8080"
      - "7077:7077"
    volumes:
      - ./spark/logs:/opt/spark/logs
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro
    command: >
      bash -lc "mkdir -p /opt/spark/logs &&
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      2>&1 | tee -a /opt/spark/logs/spark-master.log"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  spark-worker:
    container_name: spark-worker
    image: apache/spark:3.5.0
    user: root
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "4041:8081"
    volumes:
      - ./spark/logs:/opt/spark/logs
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro
    command: >
      bash -lc "mkdir -p /opt/spark/logs &&
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
      2>&1 | tee -a /opt/spark/logs/spark-worker.log"
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/output /opt/airflow/logs /opt/airflow/spark
        airflow db migrate
        airflow connections create-default-connections
        airflow users list | grep -q airflow || \
          airflow users create -r Admin -u airflow -f Airflow -l User -e airflow@example.com -p airflow
        airflow connections add 'spark_local' \
          --conn-type 'spark' \
          --conn-host 'spark://spark-master' \
          --conn-port '7077' || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: 'airflow'
      _AIRFLOW_WWW_USER_PASSWORD: 'airflow'
    depends_on:
      <<: *airflow-common-depends-on
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: always

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./logs:/opt/logs/airflow:ro
      - ./spark/logs:/opt/logs/spark:ro
      - ./alloy.conf:/etc/alloy/config.alloy:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: always

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - airflow-webserver
      - spark-master
      - spark-worker
    restart: always

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - prometheus
    restart: always

volumes:
  postgres-db-volume:
