name: Lab 3 CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run deploy job manually for the selected branch"
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: itmo-devops-airflow

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required lab directories
        run: |
          test -d dags
          test -d spark
          test -f Dockerfile
          test -f docker-compose.yml

      - name: Validate Python files
        run: python -m py_compile dags/*.py spark/*.py

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.head_ref || github.ref_name, 'feature/') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Airflow image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Inspect built image
        run: docker image inspect "$IMAGE_NAME:${{ github.sha }}"

  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    needs: build
    if: ${{ (github.event_name == 'push' && contains(fromJSON('["main","master","develop"]'), github.ref_name)) || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: docker compose up -d --build

      - name: Show deployment status
        run: docker compose ps

      - name: Wait for Airflow webserver
        run: |
          for attempt in {1..30}; do
            container_id="$(docker compose ps -q airflow-webserver)"
            health_status="$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)"

            if [ "$health_status" = "healthy" ]; then
              echo "Airflow webserver is healthy"
              exit 0
            fi

            echo "Waiting for Airflow webserver healthcheck, attempt ${attempt}/30..."
            sleep 10
          done

          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1
